<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <title>{% block title %}Home{% endblock %}</title>
        <link rel="icon" href="{{ url_for('static', filename='images/dynofin_logo_simple.png') }}" type="image/x-icon">

    </head>
    <body>        
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"
                    ><img src="{{ url_for('static', filename='images/dynofin_logo_png_text.png') }}" alt="Dynofin" height="70px" />
                </a
                >
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div
                    class="collapse navbar-collapse"
                    id="navbarSupportedContent"
                >
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                aria-current="page"
                                href="#"
                                >Home</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Logout</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Sign Up</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a
                                class="nav-link dropdown-toggle"
                                href="#"
                                role="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                            >
                                Items
                            </a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" href="#">Action</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="#"
                                        >Another action</a
                                    >
                                </li>
                                <li><hr class="dropdown-divider" /></li>
                                <li>
                                    <a class="dropdown-item" href="#"
                                        >Something else here</a
                                    >
                                </li>
                            </ul>
                        </li>
                    </ul>                    
                </div>
            </div>
        </nav>

        <div class="container">{% block content %} {% endblock %}</div>
        <div class="container">
            <footer
                class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top"
            >
                <div class="col-md-4 d-flex align-items-center">
                    
                    <span class="mb-3 mb-md-0 text-body-secondary"
                        ><p class="copyright"> © 2022 <a href="https://shopright.dynofin.com" target="_blank">ShopRight</a>. All rights Reserved. The Fintech Dynamite of Explosive Ways on Shopping Right.</p></span
                    >
                </div>

                <ul
                    class="nav col-md-4 justify-content-end list-unstyled d-flex"
                >
                    <li class="ms-3">
                        <a class="text-body-secondary" href="https://x.com/Dynofin"
                            target="_blank"><img class="bi" width="24" height="24"
                                src="{{ url_for('static', filename='images/twitter-x.svg') }}"
                        ></a>
                    </li>
                    <li class="ms-3">
                        <a class="text-body-secondary" href="https://www.instagram.com/dynofin/"
                        target="_blank"><img class="bi" width="24" height="24"
                            src="{{ url_for('static', filename='images/instagram.svg') }}"
                    ></a>
                    </li>
                    <li class="ms-3">
                        <a class="text-body-secondary" href="https://www.facebook.com/dynofin"
                        target="_blank"><img class="bi" width="24" height="24"
                            src="{{ url_for('static', filename='images/facebook.svg') }}"
                    ></a>
                    </li>
                </ul>
            </footer>
        </div>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
